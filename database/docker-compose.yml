name: gaitsense

services:
  mongodb:
    image: mongo:8.0
    container_name: gaitsense-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-gaitsense_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local_root_password_change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-gaitsense}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-gaitsense_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-local_app_password_change_me}
      MONGO_DATABASE: ${MONGO_DATABASE:-gaitsense}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo/bootstrap.js:/docker-entrypoint-initdb.d/001-bootstrap.js:ro
      - ./mongo:/workspace/mongo:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - gaitsense_internal

volumes:
  mongodb_data:
    name: gaitsense_mongodb_data

networks:
  gaitsense_internal:
    name: gaitsense_internal

