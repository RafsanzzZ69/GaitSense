name: Backend and database
on:
  push:
    paths: ['backend/**', 'database/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'database/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev,vision]'
      - run: node database/scripts/static-check.mjs && node database/scripts/export-schema.mjs --check
      - run: python -m ruff check backend
      - run: python backend/scripts/test.py -q
        env:
          GAITSENSE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
