name: Study preparation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checklist-and-data-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/study/check.py --check
      - run: python -m unittest discover -s research/study/tests -v
