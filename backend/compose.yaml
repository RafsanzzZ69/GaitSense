# Cloud database only: this does NOT start another MongoDB server.
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private_media:/workspace/backend/storage"]
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes: ["private_media:/workspace/backend/storage"]
    restart: unless-stopped
volumes:
  private_media:
