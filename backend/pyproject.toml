[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitsense-backend"
version = "0.2.0"
description = "GaitSense API, MongoDB lifecycle and research processing worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pymongo>=4.13,<5",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3", "boto3>=1.35,<2",
  "opencv-contrib-python>=4.11,<6", "numpy>=2,<3", "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
vision = ["mediapipe>=0.10.21,<0.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated MongoDB test database"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
